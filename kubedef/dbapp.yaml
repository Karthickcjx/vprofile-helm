apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprodb

spec:
  selector:
    matchLabels:
      app: vprodb
  template:
    metadata:
      labels:
        app: vprodb
    spec:
      containers:
      - name: vprodb
        image: karthickcjx/vprodb
        imagePullPolicy: Always
        ports:
        - containerPort: 3306
          name: db-port
        env:
         - name: MYSQL_ROOT_PASSWORD
           valueFrom:
             secretKeyRef:
               name: app-secret
               key: db-pass
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
      
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: db-pv-claim
      
      initContainers:
      - name: clean-db
        image: busybox:latest
        command: ["sh","-c","rm -rf /var/lib/mysql/*"]
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysqll

        
