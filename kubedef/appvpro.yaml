apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp

spec:
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
      - name: vproapp
        image: karthickcjx/vproapp
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: vproapp-port
