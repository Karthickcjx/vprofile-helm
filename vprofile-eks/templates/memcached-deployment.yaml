apiVersion: apps/v1
kind: Deployment
metadata:
  name: vprocache01
spec:
  replicas: {{ .Values.memcached.replicas }}
  selector:
    matchLabels:
      app: vprocache01
  template:
    metadata:
      labels:
        app: vprocache01
    spec:
      containers:
        - name: vprocache01
          image: {{ printf "%s:%s" .Values.memcached.image .Values.memcached.tag | quote }}
          imagePullPolicy: Always
          ports:
            - name: mc-port
              containerPort: {{ .Values.memcached.containerPort }}
