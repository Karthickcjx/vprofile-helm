apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpromq01
spec:
  replicas: {{ .Values.rabbitmq.replicas }}
  selector:
    matchLabels:
      app: vpromq01
  template:
    metadata:
      labels:
        app: vpromq01
    spec:
      containers:
        - name: vpromq01
          image: {{ printf "%s:%s" .Values.rabbitmq.image .Values.rabbitmq.tag | quote }}
          imagePullPolicy: Always
          ports:
            - name: rmq-port
              containerPort: {{ .Values.rabbitmq.containerPort }}
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: {{ .Values.rabbitmq.defaultUser | quote }}
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: rmq-pass
