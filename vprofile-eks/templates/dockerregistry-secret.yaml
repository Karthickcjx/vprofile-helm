{{- if .Values.dockerregistry.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: dockerregistry
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.dockerregistry.server (dict "username" .Values.dockerregistry.username "password" .Values.dockerregistry.password "email" .Values.dockerregistry.email "auth" (printf "%s:%s" .Values.dockerregistry.username .Values.dockerregistry.password | b64enc))) | toJson | b64enc | quote }}
{{- end }}
