app:
  image: 066107820394.dkr.ecr.ap-south-1.amazonaws.com/vprofileimg
  tag: "7"
  replicas: 1
  containerPort: 8080
  servicePort: 8080

db:
  image: karthickcjx/vprodb
  tag: latest
  replicas: 1
  containerPort: 3306
  servicePort: 3306
  storageClass: gp2
  storageSize: 5Gi

memcached:
  image: memcached
  tag: latest
  replicas: 1
  containerPort: 11211
  servicePort: 11211

rabbitmq:
  image: rabbitmq
  tag: latest
  replicas: 1
  containerPort: 5672
  servicePort: 5672
  defaultUser: guest

initcontainers:
  enabled: false
  image: busybox
  tag: latest

ingress:
  enabled: true
  host: vprofile.kcthdevops.site
  servicePort: 8080

secrets:
  dbPassword: vprodbpass
  rabbitmqPassword: guest

dockerregistry:
  enabled: false
  server: ""
  username: ""
  password: ""
  email: ""
